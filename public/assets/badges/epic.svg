<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: Deep charcoal with a warm, rich ruby-crimson ambient glow -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1f0f10"/>
      <stop offset="60%" stop-color="#0f0708"/>
      <stop offset="100%" stop-color="#050203"/>
    </radialGradient>

    <!-- Metallic Rim: Polished Gold alloy with sharp specular highlights -->
    <linearGradient id="premiumGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6d6"/> <!-- Cream Glint -->
      <stop offset="20%" stop-color="#ffd700"/> <!-- Pure Gold -->
      <stop offset="45%" stop-color="#8c6600"/> <!-- Deep Gold Shadow -->
      <stop offset="65%" stop-color="#ffea7a"/> <!-- Gold Reflection -->
      <stop offset="85%" stop-color="#ffd700"/> <!-- Pure Gold -->
      <stop offset="100%" stop-color="#332400"/> <!-- Core shadow -->
    </linearGradient>

    <!-- Inner Gem Facet: Deep Obsidian-Ruby Glass -->
    <linearGradient id="gemObsidianRuby" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/> <!-- Glowing Ruby -->
      <stop offset="50%" stop-color="#80001a"/> <!-- Rich Crimson -->
      <stop offset="100%" stop-color="#210004"/> <!-- Deep Wine Shadow -->
    </linearGradient>

    <!-- Soft outer drop shadow and glowing filters -->
    <filter id="glowRuby" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.9
        0 0.1 0 0 0.1
        0 0 0.2 0 0.2
        0 0 0 0.45 0
      "/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <clipPath id="gemClip">
      <polygon points="495,400 467,467 400,495 333,467 305,400 333,333 400,305 467,333"/>
    </clipPath>

    <!-- STAGE 4 ELEMENTS: THE ROYAL MANTLE (Top Crown & Bottom Pedestal) -->
    <!-- Apex Crown (North) -->
    <g id="apexCrown" filter="url(#softShadow)">
      <!-- Base hugging the octagon slopes perfectly -->
      <polygon points="280,190 400,140 520,190 540,100 480,120 400,40 320,120 260,100" fill="url(#premiumGold)"/>
      <!-- 3D Shading -->
      <polygon points="400,140 280,190 260,100 320,120 400,40" fill="#ffffff" opacity="0.3"/>
      <polygon points="400,140 520,190 540,100 480,120 400,40" fill="#000000" opacity="0.4"/>
      <!-- Inner Ruby Core of the Crown -->
      <polygon points="400,70 340,125 400,135 460,125" fill="url(#gemObsidianRuby)"/>
      <!-- Crown floating halo jewel at top -->
      <circle cx="400" cy="20" r="12" fill="url(#premiumGold)"/>
      <circle cx="400" cy="20" r="6" fill="#ff3344" />
    </g>

    <!-- Base Pedestal (South) -->
    <g id="basePedestal" filter="url(#softShadow)">
      <!-- Inverted base crest hugging the bottom slopes -->
      <polygon points="280,610 400,660 520,610 540,700 480,680 400,760 320,680 260,700" fill="url(#premiumGold)"/>
      <!-- 3D Shading -->
      <polygon points="400,660 280,610 260,700 320,680 400,760" fill="#ffffff" opacity="0.3"/>
      <polygon points="400,660 520,610 540,700 480,680 400,760" fill="#000000" opacity="0.4"/>
      <!-- Inner Ruby Core of the Pedestal -->
      <polygon points="400,730 340,675 400,665 460,675" fill="url(#gemObsidianRuby)"/>
    </g>
  </defs>

  <!-- 1. Background -->
  
  
  <!-- 2. Ambient Under-Medal Glow (Warm Crimson/Ruby Glow) -->
  <circle cx="400" cy="400" r="280" fill="#ff1a3b" opacity="0.12" filter="url(#glowRuby)"/>

  <!-- 3. STAGE 4 ELEMENTS: Symmetrical Vertical Anchors -->
  <!-- Top Crown (According to you) & Bottom Pedestal (According to me) -->
  <use href="#apexCrown" />
  

  <!-- 4. INHERITED STAGE 3: Outer Octagonal Bezel Frame -->
  <g filter="url(#softShadow)">
    <polygon points="660,400 584,584 400,660 216,584 140,400 216,216 400,140 584,216" fill="none" stroke="url(#premiumGold)" stroke-width="4" opacity="0.9"/>
    <polygon points="648,400 575,575 400,648 225,575 152,400 225,225 400,152 575,225" fill="none" stroke="url(#premiumGold)" stroke-width="1.5" opacity="0.5"/>

    <!-- Subtle connecting radial spokes -->
    <g stroke="url(#premiumGold)" stroke-width="2" opacity="0.4">
      <line x1="400" y1="140" x2="400" y2="164"/>
      <line x1="400" y1="660" x2="400" y2="636"/>
      <line x1="660" y1="400" x2="636" y2="400"/>
      <line x1="140" y1="400" x2="164" y2="400"/>
      <line x1="584" y1="216" x2="567" y2="233"/>
      <line x1="584" y1="584" x2="567" y2="567"/>
      <line x1="216" y1="584" x2="233" y2="567"/>
      <line x1="216" y1="216" x2="233" y2="233"/>
    </g>
  </g>

  <!-- INHERITED STAGE 2 FEATURES -->
  <g filter="url(#softShadow)">
    <!-- Main Outer Watch Bezel -->
    <circle cx="400" cy="400" r="236" fill="none" stroke="url(#premiumGold)" stroke-width="12"/>
    <circle cx="400" cy="400" r="228" fill="#171412" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2"/>

    <!-- Cardinal Major Ticks -->
    <g stroke="url(#premiumGold)" stroke-width="2" opacity="0.75">
      <line x1="400" y1="168" x2="400" y2="176"/>
      <line x1="400" y1="624" x2="400" y2="632"/>
      <line x1="168" y1="400" x2="176" y2="400"/>
      <line x1="624" y1="400" x2="632" y2="400"/>
    </g>

    <!-- Inner watch ring & Dotted Dial -->
    <circle cx="400" cy="400" r="210" fill="none" stroke="url(#premiumGold)" stroke-width="4" opacity="0.8"/>
    <circle cx="400" cy="400" r="192" fill="none" stroke="url(#premiumGold)" stroke-width="2" stroke-dasharray="6,8" opacity="0.3"/>
  </g>

  <!-- Inner Octagon Seat Frame -->
  <polygon points="507,400 476,476 400,507 324,476 293,400 324,324 400,293 476,324" fill="none" stroke="url(#premiumGold)" stroke-width="2" opacity="0.4" filter="url(#softShadow)"/>

  <!-- Octagon Vertex Rivets -->
  <g fill="url(#premiumGold)" opacity="0.6">
    <circle cx="507" cy="400" r="3.5" />
    <circle cx="476" cy="476" r="3.5" />
    <circle cx="400" cy="507" r="3.5" />
    <circle cx="324" cy="476" r="3.5" />
    <circle cx="293" cy="400" r="3.5" />
    <circle cx="324" cy="324" r="3.5" />
    <circle cx="400" cy="293" r="3.5" />
    <circle cx="476" cy="324" r="3.5" />
  </g>

  <!-- Technical Crosshair Guidelines -->
  <g stroke="url(#premiumGold)" stroke-width="1.5" opacity="0.25">
    <line x1="400" y1="190" x2="400" y2="293"/>
    <line x1="400" y1="610" x2="400" y2="507"/>
    <line x1="190" y1="400" x2="293" y2="400"/>
    <line x1="610" y1="400" x2="507" y2="400"/>
  </g>

  <!-- The Faceted Core Gem (Ruby Red) -->
  <g filter="url(#softShadow)">
    <g clip-path="url(#gemClip)">
      <polygon points="495,400 467,467 400,495 333,467 305,400 333,333 400,305 467,333" fill="url(#gemObsidianRuby)"/>
      <!-- Perfectly symmetric 8-facet 3D shading radiating from center (400,400) -->
      <polygon points="400,400 400,305 333,333" fill="#ffffff" opacity="0.12"/> <!-- North-NW -->
      <polygon points="400,400 333,333 305,400" fill="#ffffff" opacity="0.08"/> <!-- West-NW -->
      <polygon points="400,400 305,400 333,467" fill="#000000" opacity="0.15"/> <!-- West-SW -->
      <polygon points="400,400 333,467 400,495" fill="#000000" opacity="0.25"/> <!-- South-SW -->
      <polygon points="400,400 400,495 467,467" fill="#000000" opacity="0.35"/> <!-- South-SE -->
      <polygon points="400,400 467,467 495,400" fill="#000000" opacity="0.25"/> <!-- East-SE -->
      <polygon points="400,400 495,400 467,333" fill="#ffffff" opacity="0.02"/> <!-- East-NE -->
      <polygon points="400,400 467,333 400,305" fill="#ffffff" opacity="0.06"/> <!-- North-NE -->
      <rect x="200" y="230" width="80" height="340" fill="#ffffff" opacity="0.15" transform="rotate(28 400 400)"/>
    </g>
  </g>

  <!-- Beveled Outlines & Highlights -->
  <polygon points="495,400 467,467 400,495 333,467 305,400 333,333 400,305 467,333" fill="none" stroke="url(#premiumGold)" stroke-width="3"/>
  <polygon points="493,400 466,466 400,493 334,466 307,400 334,334 400,307 466,334" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>
</svg>
