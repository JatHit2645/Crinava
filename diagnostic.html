<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crinava Live-Wire Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
        }
        #sidebar {
            width: 300px;
            background: var(--card);
            border-right: 1px solid #334155;
            padding: 20px;
            overflow-y: auto;
        }
        #main {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }
        .match-card {
            background: #334155;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .match-card:hover {
            background: #475569;
            transform: translateY(-2px);
        }
        .match-card.card-crex-mapped {
            border: 2px solid rgba(16, 185, 129, 0.4) !important;
            animation: crex-mapped-glow 2s infinite ease-in-out;
        }
        .match-card.card-crex-unmapped {
            border: 2px solid rgba(245, 158, 11, 0.3) !important;
            animation: crex-unmapped-glow 2.5s infinite ease-in-out;
        }
        .match-card.card-hierarchy {
            border: 2px solid rgba(56, 189, 248, 0.3) !important;
            animation: hierarchy-glow 3s infinite ease-in-out;
        }
        .match-card.active {
            animation: none !important;
            transform: scale(1.02);
            background: #1e293b !important;
        }
        .match-card.card-crex-mapped.active {
            border-color: #10b981 !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.7) !important;
        }
        .match-card.card-crex-unmapped.active {
            border-color: #f59e0b !important;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.7) !important;
        }
        .match-card.card-hierarchy.active {
            border-color: var(--accent) !important;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.7) !important;
        }
        @keyframes crex-mapped-glow {
            0% { border-color: rgba(16, 185, 129, 0.4); box-shadow: 0 0 4px rgba(16, 185, 129, 0.1); }
            50% { border-color: rgba(16, 185, 129, 0.9); box-shadow: 0 0 16px rgba(16, 185, 129, 0.5); }
            100% { border-color: rgba(16, 185, 129, 0.4); box-shadow: 0 0 4px rgba(16, 185, 129, 0.1); }
        }
        @keyframes crex-unmapped-glow {
            0% { border-color: rgba(245, 158, 11, 0.3); box-shadow: 0 0 4px rgba(245, 158, 11, 0.05); }
            50% { border-color: rgba(245, 158, 11, 0.7); box-shadow: 0 0 12px rgba(245, 158, 11, 0.3); }
            100% { border-color: rgba(245, 158, 11, 0.3); box-shadow: 0 0 4px rgba(245, 158, 11, 0.05); }
        }
        @keyframes hierarchy-glow {
            0% { border-color: rgba(56, 189, 248, 0.3); box-shadow: 0 0 4px rgba(56, 189, 248, 0.05); }
            50% { border-color: rgba(56, 189, 248, 0.8); box-shadow: 0 0 14px rgba(56, 189, 248, 0.4); }
            100% { border-color: rgba(56, 189, 248, 0.3); box-shadow: 0 0 4px rgba(56, 189, 248, 0.05); }
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 8px;
            box-shadow: 0 0 8px #10b981;
        }
        #commentary-log {
            flex: 1;
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 15px;
        }
        .comm-entry {
            padding: 15px;
            background: #334155;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            animation: slideIn 0.3s ease-out;
        }
        .comm-over {
            font-weight: bold;
            color: var(--accent);
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            color: var(--text);
            background: #1e293b;
        }
        .tab-btn.active {
            color: var(--accent);
            background: #1e293b;
            box-shadow: inset 0 -2px 0 var(--accent);
        }
        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }
        
        .scorecard-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding-bottom: 40px;
        }
        
        .innings-card {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid #334155;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        .innings-header {
            background: #1e293b;
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .innings-title {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .innings-score {
            font-size: 1.1em;
            font-weight: 600;
        }
        
        .innings-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .sc-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-bottom: 10px;
        }
        .sc-table th {
            color: var(--muted);
            font-weight: 600;
            padding: 10px 12px;
            border-bottom: 1px solid #334155;
            font-size: 0.9em;
        }
        .sc-table td {
            padding: 12px;
            border-bottom: 1px solid #1e293b;
            font-size: 0.95em;
        }
        .sc-table tr:last-child td {
            border-bottom: none;
        }
        
        .col-player { font-weight: 600; width: 35%; }
        .col-dismissal { color: var(--muted); font-size: 0.85em; width: 35%; }
        .col-num { text-align: right; width: 6%; }
        
        .extras-row {
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: var(--muted);
            margin-bottom: 10px;
        }
        
        h1 { margin-top: 0; font-size: 1.5em; }
    </style>
</head>
<body>

<div id="sidebar">
    <h1>🏏 Live Matches</h1>
    <div id="match-list">Loading matches...</div>
</div>

<div id="main">
    <div id="active-header">
        <h1 id="current-match-title">Select a match to start streaming</h1>
        <p id="current-match-score" style="color: var(--muted)"></p>
        
        <!-- Win Predictor Widget -->
        <div id="win-predictor-widget" style="display: none; margin: 20px 0; max-width: 600px; padding: 16px; background: linear-gradient(135deg, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.85)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                <span style="font-size: 0.7rem; font-weight: 900; color: #10b981; text-transform: uppercase; tracking-wider: 0.1em; letter-spacing: 0.05em; background: rgba(16, 185, 129, 0.1); padding: 4px 8px; border-radius: 6px;">⚡ LIVE PROBABILITY</span>
                <span id="win-innings-badge" style="font-size: 0.7rem; font-weight: 800; color: #3b82f6; text-transform: uppercase; background: rgba(59, 130, 246, 0.1); padding: 4px 8px; border-radius: 6px;">Innings 1</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: 800; margin-bottom: 10px; font-family: system-ui, -apple-system, sans-serif;">
                <span id="win-team-a" style="color: #10b981; transition: all 0.3s ease;">Batting: 50.0%</span>
                <span id="win-team-b" style="color: #3b82f6; transition: all 0.3s ease;">Bowling: 50.0%</span>
            </div>
            <div style="width: 100%; height: 12px; background: rgba(15, 23, 42, 0.6); border-radius: 6px; overflow: hidden; display: flex; border: 1px solid rgba(255, 255, 255, 0.05); padding: 2px;">
                <div id="bar-team-a" style="width: 50%; height: 100%; background: linear-gradient(90deg, #059669, #10b981); border-radius: 4px; transition: width 1.2s cubic-bezier(0.1, 0.8, 0.3, 1);"></div>
                <div id="bar-team-b" style="width: 50%; height: 100%; background: linear-gradient(90deg, #3b82f6, #2563eb); border-radius: 4px; transition: width 1.2s cubic-bezier(0.1, 0.8, 0.3, 1);"></div>
            </div>
            <!-- Dynamic situational context row -->
            <div id="win-context-details" style="display: none; justify-content: space-between; margin-top: 12px; font-size: 0.75rem; color: var(--muted); border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 10px; font-family: system-ui, -apple-system, sans-serif;">
                <span id="win-target-info"></span>
                <span id="win-balls-info"></span>
            </div>
        </div>
    </div>
    
    <div class="tabs" style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px;">
        <button class="tab-btn active" onclick="switchTab('commentary')">Commentary</button>
        <button class="tab-btn" onclick="switchTab('scorecard')">Scorecard</button>
    </div>

    <!-- Commentary Tab -->
    <div id="commentary-tab" class="tab-content active">
        <div id="commentary-log">
            <div style="text-align: center; color: var(--muted)">No updates yet.</div>
        </div>
    </div>

    <!-- Scorecard Tab -->
    <div id="scorecard-tab" class="tab-content">
        <div id="scorecard-container">
            <div style="text-align: center; color: var(--muted)">Scorecard not loaded yet. Select a match to load.</div>
        </div>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(content => content.classList.remove("active"));
        
        // Find which button triggered and make it active
        const btn = document.querySelector(`.tab-btn[onclick="switchTab('${tabId}')"]`);
        if (btn) btn.classList.add("active");
        
        const content = document.getElementById(`${tabId}-tab`);
        if (content) content.classList.add("active");
    }

    function getPlayerName(id, playerMap) {
        if (!playerMap) return id;
        return playerMap[id] || playerMap[`p_${id}_name`] || playerMap[`p_${id}`] || id;
    }

    function renderScorecard(packet) {
        const scContainer = document.getElementById("scorecard-container");
        if (!scContainer) return;
        
        const scData = packet.data;
        const playerMap = packet.player_map;
        
        if (!scData || !Array.isArray(scData) || scData.length === 0) {
            scContainer.innerHTML = `<div style="text-align: center; color: var(--muted)">Scorecard not available yet.</div>`;
            return;
        }
        
        scContainer.innerHTML = "";
        
        scData.forEach((innings, index) => {
            if (!innings.d) return; 
            
            // 1. Decode Score and Balls
            const dParts = innings.d.split("(");
            const scoreStr = dParts[0];
            const balls = dParts[1] ? parseInt(dParts[1]) : 0;
            const overs = Math.floor(balls / 6) + "." + (balls % 6);
            
            // 2. Decode Extras
            const eParts = innings.e ? innings.e.split(".") : ["0","0","0","0","0"];
            const byes = parseInt(eParts[0]) || 0;
            const legByes = parseInt(eParts[1]) || 0;
            const wides = parseInt(eParts[2]) || 0;
            const noBalls = parseInt(eParts[3]) || 0;
            const totalExtras = byes + legByes + wides + noBalls;
            
            const inningsCard = document.createElement("div");
            inningsCard.className = "innings-card";
            
            const header = document.createElement("div");
            header.className = "innings-header";
            header.innerHTML = `
                <div class="innings-title">Innings ${index + 1}</div>
                <div class="innings-score">${scoreStr} (${overs} Ov)</div>
            `;
            inningsCard.appendChild(header);
            
            const body = document.createElement("div");
            body.className = "innings-body";
            
            // 3. Batting Section
            const batTable = document.createElement("table");
            batTable.className = "sc-table";
            batTable.innerHTML = `
                <thead>
                    <tr>
                        <th class="col-player">Batter</th>
                        <th class="col-dismissal">Dismissal</th>
                        <th class="col-num">R</th>
                        <th class="col-num">B</th>
                        <th class="col-num">4s</th>
                        <th class="col-num">6s</th>
                        <th class="col-num">SR</th>
                    </tr>
                </thead>
                <tbody class="batting-tbody"></tbody>
            `;
            
            const batTbody = batTable.querySelector(".batting-tbody");
            
            if (innings.b && Array.isArray(innings.b)) {
                innings.b.forEach(batStr => {
                    const segments = batStr.split("/");
                    const statsPart = segments[0];
                    const stats = statsPart.split(".");
                    
                    const pId = stats[0];
                    const pName = getPlayerName(pId, playerMap);
                    
                    if (stats.length === 1) {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td class="col-player" style="color: var(--muted)">${pName}</td>
                            <td class="col-dismissal" colspan="6">Yet to Bat</td>
                        `;
                        batTbody.appendChild(tr);
                    } else if (stats.length === 5) {
                        const runs = stats[1];
                        const balls = stats[2];
                        const fours = stats[3];
                        const sixes = stats[4];
                        const sr = balls > 0 ? ((runs / balls) * 100).toFixed(2) : "0.00";
                        
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td class="col-player">${pName} *</td>
                            <td class="col-dismissal" style="color: #10b981">Not Out</td>
                            <td class="col-num">${runs}</td>
                            <td class="col-num">${balls}</td>
                            <td class="col-num">${fours}</td>
                            <td class="col-num">${sixes}</td>
                            <td class="col-num">${sr}</td>
                        `;
                        batTbody.appendChild(tr);
                    } else if (stats.length >= 8) {
                        const runs = stats[1];
                        const balls = stats[2];
                        const fours = stats[3];
                        const sixes = stats[4];
                        const outType = stats[7];
                        const bowlerId = stats[8];
                        const fielderId = stats[9];
                        
                        const bowlerName = getPlayerName(bowlerId, playerMap);
                        const fielderName = getPlayerName(fielderId, playerMap);
                        
                        let dismissalText = "out";
                        if (outType === "1") dismissalText = `b ${bowlerName}`;
                        else if (outType === "2") dismissalText = `c ${fielderName} b ${bowlerName}`;
                        else if (outType === "4") dismissalText = `run out (${fielderName})`;
                        else dismissalText = `c & b ${bowlerName}`;
                        
                        const sr = balls > 0 ? ((runs / balls) * 100).toFixed(2) : "0.00";
                        
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td class="col-player">${pName}</td>
                            <td class="col-dismissal">${dismissalText}</td>
                            <td class="col-num">${runs}</td>
                            <td class="col-num">${balls}</td>
                            <td class="col-num">${fours}</td>
                            <td class="col-num">${sixes}</td>
                            <td class="col-num">${sr}</td>
                        `;
                        batTbody.appendChild(tr);
                    }
                });
            }
            body.appendChild(batTable);
            
            const extrasDiv = document.createElement("div");
            extrasDiv.className = "extras-row";
            extrasDiv.innerHTML = `
                <span>Extras: <strong>${totalExtras}</strong> (b ${byes}, lb ${legByes}, wd ${wides}, nb ${noBalls})</span>
            `;
            body.appendChild(extrasDiv);
            
            // 4. Bowling Section
            const bowlTable = document.createElement("table");
            bowlTable.className = "sc-table";
            bowlTable.innerHTML = `
                <thead>
                    <tr>
                        <th class="col-player">Bowler</th>
                        <th class="col-num">O</th>
                        <th class="col-num">M</th>
                        <th class="col-num">R</th>
                        <th class="col-num">W</th>
                        <th class="col-num">Econ</th>
                    </tr>
                </thead>
                <tbody class="bowling-tbody"></tbody>
            `;
            
            const bowlTbody = bowlTable.querySelector(".bowling-tbody");
            
            if (innings.a && Array.isArray(innings.a)) {
                innings.a.forEach(bowlStr => {
                    const stats = bowlStr.split(".");
                    if (stats.length >= 5) {
                        const pId = stats[0];
                        const runs = stats[1];
                        const balls = stats[2];
                        const maidens = stats[3];
                        const wickets = stats[4];
                        
                        const pName = getPlayerName(pId, playerMap);
                        const oversStr = Math.floor(balls / 6) + "." + (balls % 6);
                        const econ = balls > 0 ? ((runs / balls) * 6).toFixed(2) : "0.00";
                        
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td class="col-player">${pName}</td>
                            <td class="col-num">${oversStr}</td>
                            <td class="col-num">${maidens}</td>
                            <td class="col-num">${runs}</td>
                            <td class="col-num">${wickets}</td>
                            <td class="col-num">${econ}</td>
                        `;
                        bowlTbody.appendChild(tr);
                    }
                });
            }
            body.appendChild(bowlTable);
            
            inningsCard.appendChild(body);
            scContainer.appendChild(inningsCard);
        });
    }

    let pollInterval = null;
    let selectedMatchId = null;

    function setStatus(msg, color = "var(--muted)") {
        const scoreEl = document.getElementById("current-match-score");
        scoreEl.innerText = msg;
        scoreEl.style.color = color;
    }

    async function fetchMatches() {
        try {
            const resp = await fetch(`./matches?key=crinava_ultra_secure_123`);
            const matches = await resp.json();
            const list = document.getElementById("match-list");
            list.innerHTML = "";
            
            matches.forEach(m => {
                const card = document.createElement("div");
                
                let sourceClass = "card-hierarchy";
                if (m.source === "crex") {
                    if (m.cricbuzz_id !== null && m.cricbuzz_id !== undefined) {
                        sourceClass = "card-crex-mapped";
                    } else {
                        sourceClass = "card-crex-unmapped";
                    }
                }
                
                card.className = `match-card ${sourceClass} ${selectedMatchId === m.match_id ? 'active' : ''}`;
                
                let stateLabel = m.state || "Live";
                let stateColor = "#10b981";
                if (stateLabel === "Completed") stateColor = "#64748b";
                else if (stateLabel === "Upcoming") stateColor = "#f59e0b";
                
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <div style="flex: 1; display: flex; align-items: center; overflow: hidden;">
                            <span class="status-dot" style="background: ${stateColor}; flex-shrink: 0;"></span>
                            <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${m.title}">${m.title}</span>
                        </div>
                        <span style="font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); color: ${stateColor}; margin-left: 8px; flex-shrink: 0;">${stateLabel}</span>
                    </div>
                `;
                card.onclick = () => selectMatch(m);
                list.appendChild(card);
            });
        } catch (e) { console.error(e); }
    }

    function parseScoreString(scoreStr) {
        if (!scoreStr) return null;
        const s = scoreStr.toLowerCase().trim();
        
        let overs = 0;
        let balls = 0;
        const overMatch = s.match(/(?:\(|in\s+|after\s+)?(\d+)\.(\d+)(?:\s*ov|\s*overs|\))?/);
        if (overMatch) {
            overs = parseInt(overMatch[1]);
            balls = parseInt(overMatch[2]);
        } else {
            const wholeMatch = s.match(/(?:\(|in\s+|after\s+)?(\d+)\s*(?:ov|overs|\))/);
            if (wholeMatch) {
                overs = parseInt(wholeMatch[1]);
                balls = 0;
            }
        }
        
        let runs = 0;
        let wickets = 0;
        const runsWicketsMatch = s.match(/(\d+)(?:\s*[\/-]\s*(\d+))?/);
        if (runsWicketsMatch) {
            runs = parseInt(runsWicketsMatch[1]);
            if (runsWicketsMatch[2]) {
                wickets = parseInt(runsWicketsMatch[2]);
            } else if (s.includes("all out") || s.includes("allout")) {
                wickets = 10;
            }
        }
        return { runs, wickets, overs, balls };
    }

    function selectMatch(match) {
        if (selectedMatchId === match.match_id) return;
        
        selectedMatchId = match.match_id;
        document.getElementById("current-match-title").innerText = match.title;
        document.getElementById("commentary-log").innerHTML = "";
        document.getElementById("scorecard-container").innerHTML = `<div style="text-align: center; color: var(--muted)">Loading scorecard data...</div>`;
        
        // Reset and hide win predictor widget to prevent data leakage!
        const widget = document.getElementById("win-predictor-widget");
        if (widget) widget.style.display = "none";
        
        const detailsRow = document.getElementById("win-context-details");
        if (detailsRow) detailsRow.style.display = "none";
        
        const targetEl = document.getElementById("win-target-info");
        const ballsEl = document.getElementById("win-balls-info");
        if (targetEl) targetEl.innerHTML = "";
        if (ballsEl) ballsEl.innerHTML = "";
        
        const teamAEl = document.getElementById("win-team-a");
        const teamBEl = document.getElementById("win-team-b");
        if (teamAEl) teamAEl.innerText = "Batting: 50.0%";
        if (teamBEl) teamBEl.innerText = "Bowling: 50.0%";
        
        const barA = document.getElementById("bar-team-a");
        const barB = document.getElementById("bar-team-b");
        if (barA) barA.style.width = "50%";
        if (barB) barB.style.width = "50%";
        
        setStatus("Syncing with live feed...");
        
        // Instant visual feedback for sidebar
        document.querySelectorAll(".match-card").forEach(card => {
            card.classList.remove("active");
            if (card.innerText.includes(match.title)) card.classList.add("active");
        });
        
        if (window.eventSource) {
            window.eventSource.close();
            window.eventSource = null;
        }
        if (pollInterval) {
            clearInterval(pollInterval);
            pollInterval = null;
        }

        const startPolling = () => {
            const sync = async () => {
                try {
                    const resp = await fetch(`./history/${match.match_id}?key=crinava_ultra_secure_123`);
                    const history = await resp.json();
                    if (history.length > 0) {
                        history.forEach(packet => addCommentary(packet));
                        setStatus(`Live Score: ${history[history.length-1].score}`, "#10b981");
                    } else {
                        setStatus("Waiting for first ball...", "#f59e0b");
                    }
                } catch (e) {
                    setStatus("Sync Error. Retrying...", "#ef4444");
                }
            };
            sync();
            pollInterval = setInterval(sync, 3000);
        };

        // Try SSE EventSource first
        try {
            const source = new EventSource(`./stream/${match.match_id}?key=crinava_ultra_secure_123`);
            window.eventSource = source;

            source.onmessage = (event) => {
                try {
                    const packet = JSON.parse(event.data);
                    if (packet.type === "scorecard") {
                        renderScorecard(packet);
                    } else {
                        addCommentary(packet);
                    }
                } catch (e) {
                    console.error("SSE parse error", e);
                }
            };

            source.onerror = (err) => {
                console.warn("SSE Connection error, falling back to polling", err);
                source.close();
                window.eventSource = null;
                startPolling();
            };
        } catch (e) {
            console.error("EventSource initialization failed, using polling fallback", e);
            startPolling();
        }
    }

    function addCommentary(data) {
        if (!data || data.type === "scorecard") return;
        setStatus(`Live Score: ${data.score}`, "#10b981");
        const log = document.getElementById("commentary-log");
        
        // Ensure win predictor widget is visible and updated on EVERY ball!
        if (data.score) {
            const widget = document.getElementById("win-predictor-widget");
            const titleEl = document.getElementById("current-match-title");
            const titleText = titleEl ? titleEl.innerText.toLowerCase() : "";
            
            if (titleText.includes("test")) {
                if (widget) widget.style.display = "none";
            } else {
                if (widget) widget.style.display = "block";
            }
            
            const badge = document.getElementById("win-innings-badge");
            const detailsRow = document.getElementById("win-context-details");
            const targetEl = document.getElementById("win-target-info");
            const ballsEl = document.getElementById("win-balls-info");
            
            const parts = data.score.split("|").map(p => p.trim());
            const innings_no = parts.length;
            
            if (badge) {
                badge.innerText = `Innings ${innings_no}`;
                badge.style.display = "inline-block";
            }
            
            try {
                if (innings_no === 2 && detailsRow && targetEl && ballsEl) {
                    const firstInnings = parseScoreString(parts[0]);
                    const secondInnings = parseScoreString(parts[parts.length - 1]);
                    
                    if (firstInnings && secondInnings) {
                        const target = firstInnings.runs + 1;
                        const currentRuns = secondInnings.runs;
                        const currentWkts = secondInnings.wickets;
                        const over_no = secondInnings.overs;
                        const ball_no = secondInnings.balls;
                        
                        const runs_needed = Math.max(0, target - currentRuns);
                        const wickets_left = Math.max(0, 10 - currentWkts);
                        
                        let totalBalls = 120;
                        if (titleText.includes("t10") || titleText.includes("10 overs") || titleText.includes("t-10") || titleText.includes("10-over") || titleText.includes("ten-ten")) {
                            totalBalls = 60;
                        } else if (firstInnings.overs > 20 || titleText.includes("odi") || titleText.includes("50 overs") || titleText.includes("list a")) {
                            totalBalls = 300;
                        }
                        
                        const balls_remaining = Math.max(0, totalBalls - (over_no * 6 + ball_no));
                        const oversRem = Math.floor(balls_remaining / 6) + "." + (balls_remaining % 6);
                        
                        detailsRow.style.display = "flex";
                        targetEl.innerHTML = `Target: <strong style="color: #ffffff">${target}</strong> | Need <strong style="color: #10b981">${runs_needed}</strong> runs`;
                        ballsEl.innerHTML = `<strong style="color: #3b82f6">${balls_remaining}</strong> balls left (${oversRem} Ov) | <strong style="color: #ef4444">${wickets_left}</strong> wkts left`;
                    } else {
                        detailsRow.style.display = "none";
                    }
                } else if (innings_no === 1 && detailsRow && targetEl && ballsEl) {
                    const firstInnings = parseScoreString(parts[0]);
                    if (firstInnings && firstInnings.overs > 0) {
                        const over_no = firstInnings.overs;
                        const ball_no = firstInnings.balls;
                        
                        let totalBalls = 120;
                        if (titleText.includes("t10") || titleText.includes("10 overs") || titleText.includes("t-10") || titleText.includes("10-over") || titleText.includes("ten-ten")) {
                            totalBalls = 60;
                        } else if (firstInnings.overs > 20 || titleText.includes("odi") || titleText.includes("50 overs") || titleText.includes("list a")) {
                            totalBalls = 300;
                        }
                        
                        const balls_remaining = Math.max(0, totalBalls - (over_no * 6 + ball_no));
                        const oversRem = Math.floor(balls_remaining / 6) + "." + (balls_remaining % 6);
                        
                        detailsRow.style.display = "flex";
                        targetEl.innerHTML = `Innings 1 | Batting First`;
                        ballsEl.innerHTML = `<strong style="color: #3b82f6">${balls_remaining}</strong> balls left (${oversRem} Ov)`;
                    } else {
                        detailsRow.style.display = "flex";
                        targetEl.innerHTML = `<span style="color: var(--muted)">Match Not Started Yet</span>`;
                        ballsEl.innerHTML = ``;
                    }
                } else {
                    if (detailsRow) detailsRow.style.display = "none";
                }
            } catch(e) { 
                console.error(e); 
                if (detailsRow) detailsRow.style.display = "none";
            }
        }
        
        // Update Win Predictor Widget if data is present
        if (data.win_predictor) {
            let teamA = "Batting Team";
            let teamB = "Bowling Team";
            
            const wp = data.win_predictor;
            if (wp.batting_team) teamA = wp.batting_team;
            if (wp.bowling_team) teamB = wp.bowling_team;
            
            let win_returned = 50.0;
            if (wp.win_probability !== undefined) {
                win_returned = parseFloat(wp.win_probability);
            } else if (wp.win_prob !== undefined) {
                win_returned = (parseFloat(wp.win_prob) * 100);
            } else if (wp.batting_win_pct !== undefined) {
                win_returned = parseFloat(wp.batting_win_pct);
            }
            
            // Apply bulletproof frontend overrides using parsed real-time stats
            const parts = data.score ? data.score.split("|").map(p => p.trim()) : [];
            const innings_no = parts.length;
            if (innings_no === 2) {
                const firstInnings = parseScoreString(parts[0]);
                const secondInnings = parseScoreString(parts[parts.length - 1]);
                if (firstInnings && secondInnings) {
                    const target = firstInnings.runs + 1;
                    const currentRuns = secondInnings.runs;
                    const currentWkts = secondInnings.wickets;
                    const over_no = secondInnings.overs;
                    const ball_no = secondInnings.balls;
                    
                    const runs_needed = Math.max(0, target - currentRuns);
                    const wickets_left = Math.max(0, 10 - currentWkts);
                    
                    const titleEl = document.getElementById("current-match-title");
                    const titleText = titleEl ? titleEl.innerText.toLowerCase() : "";
                    
                    let totalBalls = 120;
                    if (titleText.includes("t10") || titleText.includes("10 overs") || titleText.includes("t-10") || titleText.includes("10-over") || titleText.includes("ten-ten")) {
                        totalBalls = 60;
                    } else if (firstInnings.overs > 20 || titleText.includes("odi") || titleText.includes("50 overs") || titleText.includes("list a")) {
                        totalBalls = 300;
                    }
                    
                    const balls_remaining = Math.max(0, totalBalls - (over_no * 6 + ball_no));
                    
                    if (runs_needed <= 0) {
                        win_returned = 100.0; // Batting team won
                    } else if (wickets_left <= 0 || balls_remaining <= 0 || runs_needed > balls_remaining * 6) {
                        win_returned = 0.0; // Batting team lost
                    }
                }
            }
            
            const winA_str = win_returned.toFixed(1);
            const winB_str = (100.0 - parseFloat(winA_str)).toFixed(1);
            
            document.getElementById("win-team-a").innerText = `${teamA}: ${winA_str}%`;
            document.getElementById("win-team-b").innerText = `${teamB}: ${winB_str}%`;
            document.getElementById("bar-team-a").style.width = `${winA_str}%`;
            document.getElementById("bar-team-b").style.width = `${winB_str}%`;
        }

        const existing = document.getElementById(`ball-${data.over_ball}`);
        if (existing) {
            const commDiv = existing.querySelector(".comm-text") || existing.children[1];
            if (commDiv && commDiv.innerText !== data.commentary) {
                commDiv.innerText = data.commentary;
            }
            return;
        }

        const entry = document.createElement("div");
        entry.id = `ball-${data.over_ball}`;
        entry.className = "comm-entry";
        entry.innerHTML = `
            <div class="comm-over">OVER ${data.over_ball} | ${data.runs_scored}</div>
            <div class="comm-text">${data.commentary}</div>
        `;
        log.prepend(entry);
    }

    // Start discovery cycle
    fetchMatches();
    setInterval(fetchMatches, 10000);
</script>

</body>
